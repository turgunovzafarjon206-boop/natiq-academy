services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: natiq
      POSTGRES_PASSWORD: natiq
      POSTGRES_DB: natiq
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U natiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: "postgresql://natiq:natiq@db:5432/natiq?schema=public"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
