<title>Natiq Academy</title>
<meta name="description" content="Natiq Academy — barcha rollar uchun interaktiv SaaS prototip.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F6F4EF; --surface:#FFFFFF; --surface-2:#F0EDE6; --surface-3:#E7E3D8;
  --ink:#1A211F; --ink-2:#414B48; --ink-3:#727C77; --line:#E1DCD1; --line-2:#CFC9BB;
  --brand:#0E6F63; --brand-ink:#0A544B; --brand-soft:#DDEBE7; --brand-2:#0B5A9C;
  --gold:#B5842A; --gold-soft:#F4E8CD;
  --ok:#2E8B62; --warn:#B7791F; --bad:#C0503F;
  --ok-soft:#DEEEE5; --warn-soft:#F6EBD3; --bad-soft:#F6E0DA;
  --purple:#6B4FA0; --purple-soft:#EAE3F4;
  --r:14px; --r-sm:9px; --r-xs:7px;
  --sh:0 1px 2px rgba(20,30,28,.05),0 10px 26px -14px rgba(20,30,28,.16);
  --sh-sm:0 1px 2px rgba(20,30,28,.06);
  --fd:"Bricolage Grotesque",system-ui,sans-serif;
  --fb:"IBM Plex Sans",system-ui,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#100E0A; --surface:#1A1914; --surface-2:#211F18; --surface-3:#2B2820;
  --ink:#F2EEE4; --ink-2:#C6C0B1; --ink-3:#8E887A; --line:#2E2B23; --line-2:#413D33;
  --brand:#4FBFAE; --brand-ink:#8AD6C9; --brand-soft:#123531; --brand-2:#5AA6E0;
  --gold:#DDB35A; --gold-soft:#33290F;
  --ok:#5BC08C; --warn:#E0B25A; --bad:#E28173;
  --ok-soft:#153020; --warn-soft:#332813; --bad-soft:#331c16;
  --purple:#A488D8; --purple-soft:#241d33;
  --sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
  --sh-sm:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --ground:#100E0A; --surface:#1A1914; --surface-2:#211F18; --surface-3:#2B2820;
  --ink:#F2EEE4; --ink-2:#C6C0B1; --ink-3:#8E887A; --line:#2E2B23; --line-2:#413D33;
  --brand:#4FBFAE; --brand-ink:#8AD6C9; --brand-soft:#123531; --brand-2:#5AA6E0;
  --gold:#DDB35A; --gold-soft:#33290F;
  --ok:#5BC08C; --warn:#E0B25A; --bad:#E28173;
  --ok-soft:#153020; --warn-soft:#332813; --bad-soft:#331c16;
  --purple:#A488D8; --purple-soft:#241d33;
  --sh:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
  --sh-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.02em;margin:0;text-wrap:balance}
button{font-family:var(--fb);cursor:pointer}
a{color:inherit}
img{max-width:100%}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---- persona switcher (floating) ---- */
body{padding-top:44px}
#persona{position:fixed;z-index:70;top:0;left:0;right:0;display:flex;gap:4px;background:var(--surface);
  border-bottom:1px solid var(--line);padding:6px 14px;box-shadow:var(--sh-sm);overflow-x:auto;align-items:center}
#persona .plab{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-right:8px;white-space:nowrap}
#persona button{border:none;background:transparent;color:var(--ink-2);font-size:12.5px;font-weight:600;
  padding:6px 12px;border-radius:24px;white-space:nowrap;display:flex;align-items:center;gap:5px}
#persona button.on{background:var(--brand);color:#fff}
#persona button:hover:not(.on){background:var(--surface-2);color:var(--ink)}
.pdot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}

/* ============ APP SHELL ============ */
.app{display:grid;grid-template-columns:246px minmax(0,1fr);min-height:100vh}
.app{min-height:calc(100vh - 44px)}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:44px;height:calc(100vh - 44px);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.glyph{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),var(--brand-ink));color:#fff;box-shadow:var(--sh-sm)}
.glyph svg{width:19px;height:19px}
.brand b{font-family:var(--fd);font-weight:700;font-size:15px;line-height:1}
.brand small{display:block;color:var(--ink-3);font-size:10px;letter-spacing:.13em;text-transform:uppercase;font-weight:600;margin-top:2px}
.navlabel{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:12px 10px 5px}
.navitem{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--ink-2);
  font-size:14px;font-weight:500;border:none;background:transparent;width:100%;text-align:left}
.navitem svg{width:18px;height:18px;flex:none;opacity:.85}
.navitem .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--surface-3);color:var(--ink-2);border-radius:20px;padding:1px 7px}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
.navitem.on .cnt{background:var(--brand);color:#fff}
.side-foot{margin-top:auto;padding-top:12px}
.userbox{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.userbox b{font-size:13px;display:block;line-height:1.2}
.userbox span{font-size:11px;color:var(--ink-3)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:44px;z-index:30;background:color-mix(in srgb,var(--ground) 82%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 26px;
  display:flex;align-items:center;gap:16px}
.topbar h1{font-size:19px}
.topbar .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.search{margin-left:auto;position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;width:15px;height:15px;color:var(--ink-3)}
.search input{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px 8px 32px;
  font-family:var(--fb);font-size:13px;color:var(--ink);width:210px;outline:none}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2);position:relative}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.iconbtn svg{width:17px;height:17px}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.content{padding:24px 26px 60px;max-width:1240px;width:100%}

/* ---- generic ---- */
.row{display:flex;gap:16px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm)}
.card.pad0{padding:0;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font-size:15.5px}.ch .sub{font-size:12px;color:var(--ink-3)}
.ch .act{margin-left:auto;display:flex;gap:6px;align-items:center}
.pageintro{color:var(--ink-2);font-size:14px;margin:-4px 0 20px;max-width:75ch}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;font-size:13.5px;font-weight:600;
  padding:9px 15px;border:1px solid transparent;background:var(--brand);color:#fff;line-height:1}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--brand-ink)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--line-2);color:var(--ink)}
.btn.gold{background:var(--gold);color:#fff}.btn.gold:hover{filter:brightness(.94)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.full{width:100%;justify-content:center}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}.b-brand{background:var(--brand-soft);color:var(--brand-ink)}
.b-gold{background:var(--gold-soft);color:var(--gold)}.b-neutral{background:var(--surface-3);color:var(--ink-2)}
.b-purple{background:var(--purple-soft);color:var(--purple)}
.dotb::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh-sm);position:relative}
.kpi .lab{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px}
.kpi .lab .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.kpi .val{font-family:var(--fd);font-size:27px;font-weight:700;letter-spacing:-.02em;margin-top:9px;line-height:1}
.kpi .trend{font-size:12px;font-weight:600;margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--ok)}.down{color:var(--bad)}

/* progress ring */
.ring{--p:0;--s:66px;--c:var(--brand);width:var(--s);height:var(--s);border-radius:50%;flex:none;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--fd);font-size:14px;font-weight:700}
.rings{width:16px;height:16px}

/* progress bar */
.pbar{height:8px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:20px;background:var(--brand)}
.pbar.gold>i{background:var(--gold)}

/* list rows */
.lrow{display:flex;align-items:center;gap:13px;padding:12px 4px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:none}
.lrow .thumb{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:19px}
.lrow .gr{flex:1;min-width:0}
.lrow .gr b{font-size:14px;display:block}
.lrow .gr span{font-size:12.5px;color:var(--ink-3)}

/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:11px 15px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--surface-2);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.tcell{display:flex;align-items:center;gap:10px}
.mini-av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{border:none;background:transparent;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--brand-ink);border-bottom-color:var(--brand)}
.tab:hover:not(.on){color:var(--ink)}

/* filter chips */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.fchip.on{background:var(--brand);color:#fff;border-color:transparent}
.fchip:hover:not(.on){border-color:var(--line-2)}

/* empty state */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .e-ic{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;font-size:24px}
.empty b{display:block;color:var(--ink);font-family:var(--fd);font-size:16px;margin-bottom:4px}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;
  animation:sh 1.4s infinite;border-radius:7px}
@keyframes sh{to{background-position:-200% 0}}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;
  background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:500;
  box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:9px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast .tk{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff}

/* achievement badges */
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px 6px;border-radius:12px}
.ach .em{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:var(--surface-2)}
.ach.lit .em{background:var(--gold-soft)}
.ach small{font-size:11px;color:var(--ink-3);line-height:1.3}
.ach.lit small b{color:var(--ink)}
.ach.off{opacity:.42}

/* ============ PUBLIC SITE ============ */
.site{min-height:100vh}
.snav{position:sticky;top:44px;z-index:30;background:color-mix(in srgb,var(--ground) 85%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.snav .in{max-width:1120px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:22px}
.snav .links{display:flex;gap:20px;margin-left:14px}
.snav .links a{font-size:13.5px;color:var(--ink-2);text-decoration:none;font-weight:500}
.snav .links a:hover{color:var(--brand-ink)}
.snav .r{margin-left:auto;display:flex;gap:9px;align-items:center}
.sect{max-width:1120px;margin:0 auto;padding:0 26px}
.hero{padding:64px 0 40px;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:500}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.03;margin:16px 0 16px}
.hero p{font-size:17.5px;color:var(--ink-2);max-width:46ch;line-height:1.55}
.hero .cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh)}
.statbar{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;margin:12px 0 8px}
.statbar div{background:var(--surface);padding:20px 16px;text-align:center}
.statbar b{font-family:var(--fd);font-size:26px;font-weight:700;display:block;letter-spacing:-.02em}
.statbar span{font-size:12.5px;color:var(--ink-3)}
.block{padding:52px 0}
.block h2{font-size:clamp(26px,3.4vw,34px);margin-bottom:8px}
.block .lead{color:var(--ink-2);max-width:60ch;margin-bottom:28px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-sm);display:flex;flex-direction:column}
.ccard .top{height:96px;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative}
.ccard .bd{padding:15px 17px 17px;display:flex;flex-direction:column;gap:8px;flex:1}
.ccard h4{font-size:16px}
.ccard .meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;margin-top:auto}
.feat{display:flex;gap:13px;align-items:flex-start}
.feat .fi{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.feat .fi svg{width:20px;height:20px}
.feat b{font-size:15.5px;font-family:var(--fd)}
.feat p{font-size:13.5px;color:var(--ink-2);margin:3px 0 0}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{position:relative;padding-top:8px}
.step .no{font-family:var(--fd);font-size:15px;font-weight:700;color:#fff;background:var(--brand);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:12px}
.step b{font-size:15px;font-family:var(--fd);display:block;margin-bottom:4px}
.step p{font-size:13px;color:var(--ink-2);margin:0}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh-sm)}
.tcard .q{font-size:14.5px;color:var(--ink);line-height:1.55}
.tcard .who{display:flex;align-items:center;gap:11px;margin-top:16px}
.faq{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.faq details{border-bottom:1px solid var(--line)}
.faq details:last-child{border-bottom:none}
.faq summary{padding:15px 18px;font-weight:600;font-size:14.5px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brand);font-size:20px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{padding:0 18px 16px;margin:0;color:var(--ink-2);font-size:13.5px;max-width:none}
.ctaband{background:linear-gradient(150deg,var(--brand),var(--brand-ink));border-radius:22px;padding:44px;text-align:center;color:#fff;margin:20px 0}
.ctaband h2{color:#fff;font-size:clamp(24px,3.2vw,32px)}
.ctaband p{color:rgba(255,255,255,.85);max-width:50ch;margin:10px auto 22px}
.sfoot{border-top:1px solid var(--line);margin-top:40px}
.sfoot .in{max-width:1120px;margin:0 auto;padding:34px 26px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
.sfoot h5{font-size:13px;margin:0 0 10px;color:var(--ink)}
.sfoot a{display:block;color:var(--ink-3);text-decoration:none;font-size:13px;padding:3px 0}
.sfoot a:hover{color:var(--brand-ink)}
.sfoot .copy{border-top:1px solid var(--line);padding:16px 26px;text-align:center;color:var(--ink-3);font-size:12.5px}

/* charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px;vertical-align:middle}

@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr;gap:26px}
  .steps,.sfoot .in{grid-template-columns:repeat(2,1fr)}.statbar{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:18px 16px 90px}
  .topbar{padding:12px 16px}
  .search input{width:130px}
  .g2,.g3{grid-template-columns:1fr}
  .snav .links{display:none}
  .mobnav{display:flex!important}
  .content{padding-bottom:86px}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}

/* mobile bottom nav */
.mobnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding:6px 4px env(safe-area-inset-bottom);justify-content:space-around}

/* ================= helpers ================= */
function kpi(lab,val,icn,col,sub){return `<div class="kpi"><div class="lab"><span class="ic" style="background:${col}22;color:${col}">${ic(icn)}</span>${lab}</div><div class="val num">${val}</div><div class="trend" style="color:var(--ink-3)">${sub||'—'}</div></div>`;}
function es(icon,title,sub,cta){return `<div class="empty"><div class="e-ic">${icon}</div><b>${title}</b>${sub||''}${cta?'<div style="margin-top:15px;display:flex;justify-content:center">'+cta+'</div>':''}</div>`;}
function langSw(){return `<div class="langsw">${['uz','ru','en'].map(l=>`<button class="${DB.lang===l?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')}</div>`;}
function courseName(id){const c=DB.courses.find(x=>x.id===id);return c?c.title:'—';}
function groupName(id){const g=DB.groups.find(x=>x.id===id);return g?g.code+' · '+g.name:'—';}
function teacherName(id){const u=DB.users.find(x=>x.id===id);return u?u.name:'—';}
function teacherOptions(sel){return DB.users.filter(u=>u.role==='teacher').map(u=>`<option value="${u.id}" ${u.id===sel?'selected':''}>${u.name}</option>`).join('')||'<option value="">— (avval oʻqituvchi qoʻshing)</option>';}
function courseOptions(sel){return DB.courses.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.title}</option>`).join('')||'<option value="">—</option>';}
function groupOptions(sel){return DB.groups.map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${g.code} · ${g.name}</option>`).join('')||'<option value="">—</option>';}
function studentOptions(sel){return DB.students.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${s.name}</option>`).join('')||'<option value="">—</option>';}

function closeModal(){document.getElementById('modal-root').innerHTML='';}
function fld(id,label,opts={}){const{type='text',ph='',val='',full=false,sel=''}=opts;
 const cls=full?'field full':'field';
 if(type==='select')return `<div class="${cls}"><label>${label}</label><select id="${id}">${opts.options||''}</select></div>`;
 if(type==='textarea')return `<div class="${cls}"><label>${label}</label><textarea id="${id}" rows="3" placeholder="${ph}">${val}</textarea></div>`;
 return `<div class="${cls}"><label>${label}</label><input id="${id}" type="${type}" placeholder="${ph}" value="${val}"></div>`;}
const V=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};

   ${kpi('Kutilayotgan',fmt(Math.max(0,expected-collected))+' soʻm','clock','#B7791F')}
   ${kpi(t('debt'),fmt(debt)+' soʻm','cash','#C0503F')}
   ${kpi(t('students'),DB.students.length,'users','#0E6F63')}</div>
 <div style="display:flex;margin-bottom:14px"><button class="btn" style="margin-left:auto" onclick="formPayment()">${ic('plus')} ${t('addPayment')}</button></div>
 ${DB.payments.length?`<div class="tw"><table><thead><tr><th>${t('students')}</th><th>${t('amount')}</th><th>${t('method')}</th><th>${t('date')}</th></tr></thead><tbody>
 ${DB.payments.slice().reverse().map(p=>{const s=DB.students.find(x=>x.id===p.studentId);return `<tr><td><div class="tcell"><span class="mini-av" style="background:${avc(s?s.name:'?')}">${ini(s?s.name:'?')}</span>${s?s.name:'—'}</div></td>
   <td class="num" style="color:var(--ok);font-weight:600">+${fmt(p.amount)} soʻm</td><td>${p.method||'—'}</td><td>${p.date||''}</td></tr>`;}).join('')}
 </tbody></table></div>`:es('💳',t('noData'),'',`<button class="btn" onclick="formPayment()">${ic('plus')} ${t('addPayment')}</button>`)}`;
}

/* ================= TEACHER ================= */
function myGroupsOfTeacher(){return DB.groups.filter(g=>g.teacherId===SES.userId);}
function teacherGroups(){const gs=myGroupsOfTeacher();
 return `<p class="pageintro">${t('myGroups')} — ${gs.length}. Hozirgi mavzuni yangilab boring.</p>
 ${gs.length?`<div class="grid g2">${gs.map(g=>{const cnt=DB.students.filter(s=>s.groupId===g.id).length;return `<div class="card">
   <div><span class="badge b-brand mono">${g.code}</span> <b style="font-family:var(--fd)">${g.name||''}</b>
     <div style="font-size:12.5px;color:var(--ink-3);margin-top:4px">${courseName(g.courseId)} · ${cnt} ${t('students').toLowerCase()} · ${g.schedule||''}</div></div>
   <div style="display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:12px"><span class="topic">${ic('book2')} ${g.topic||t('noData')}</span>
     <button class="btn ghost sm" onclick="editTopic('${g.id}')">${ic('edit')} ${t('updateTopic')}</button></div></div>`;}).join('')}</div>`
 :es('📚',t('noData'),'Sizga guruh biriktirilgach shu yerda koʻrinadi.')}`;
}
function teacherStudents(){const gids=myGroupsOfTeacher().map(g=>g.id);const st=DB.students.filter(s=>gids.includes(s.groupId));
 return `<p class="pageintro">${t('students')} — ${st.length}</p>
 ${st.length?`<div class="tw"><table><thead><tr><th>${t('name')}</th><th>${t('group')}</th><th>${t('phone')}</th></tr></thead><tbody>
 ${st.map(s=>`<tr><td><div class="tcell"><span class="mini-av" style="background:${avc(s.name)}">${ini(s.name)}</span>${s.name}</div></td><td class="mono">${groupName(s.groupId)}</td><td>${s.phone||'—'}</td></tr>`).join('')}
 </tbody></table></div>`:es('🧑‍🎓',t('noData'),'Guruhingizga talaba qoʻshilgach koʻrinadi.')}`;
}

/* ================= STUDENT ================= */
function studentRecord(){const u=currentUser();return DB.students.find(s=>s.phone&&u.phone&&s.phone.replace(/\s/g,'')===u.phone.replace(/\s/g,''));}
function studentDash(){const u=currentUser();const rec=studentRecord();
 const g=rec&&rec.groupId?DB.groups.find(x=>x.id===rec.groupId):null;
 return `<p class="pageintro">${t('welcome')}, <b>${u.name}</b> 👋</p>
 <div class="grid g2">
   <div class="card"><div class="ch"><h3>${t('myGroup')}</h3></div>
     ${g?`<div style="font-size:15px;font-weight:600">${g.code} · ${g.name||''}</div>
       <div style="font-size:13px;color:var(--ink-3);margin:4px 0 12px">${courseName(g.courseId)} · ${teacherName(g.teacherId)} · ${g.schedule||''}</div>
       <div style="font-size:12px;color:var(--ink-3);margin-bottom:5px">${t('topic')}:</div><span class="topic">${ic('book2')} ${g.topic||t('noData')}</span>`
     :es('📚',t('noData'),'Guruhga biriktirilgach shu yerda koʻrinadi.')}</div>
   <div class="card"><div class="ch"><h3>${t('paymentStatus')}</h3></div>
     ${rec?`<div style="font-size:13px;display:grid;grid-template-columns:1fr auto;gap:7px 10px">
       <span>${t('course')}</span><b>${courseName(rec.courseId)}</b>
       <span>${t('price')}</span><b class="num">${fmt(rec.coursePrice)} soʻm</b>
       <span>${t('balance')}</span><b class="num" style="color:var(--ok)">${fmt(rec.paid)} soʻm</b>
       <span>${t('debt')}</span><b class="num" style="color:var(--bad)">${fmt(Math.max(0,(rec.coursePrice||0)-(rec.paid||0)))} soʻm</b></div>`
     :es('💳',t('noData'),'Profilingiz admin tomonidan toʻldirilgach koʻrinadi.')}</div>
 </div>`;
}
function parentDash(){return `<p class="pageintro">${t('welcome')}</p>${es('👨‍👩‍👧',t('noData'),'Farzandingiz hisobingizga bogʻlangach, uning maʼlumotlari shu yerda koʻrinadi.')}`;}

/* ================= ROUTER ================= */
const VIEWS={
 dash:[adminDash,()=>t('dashboard')],students:[adminStudents,()=>t('students')],groups:[adminGroups,()=>t('groups')],
 courses:[adminCourses,()=>t('courses')],finance:[financeView,()=>t('finance')],usersv:[adminUsers,()=>t('users')],
 tgroups:[teacherGroups,()=>t('myGroups')],tstudents:[teacherStudents,()=>t('students')],
 sdash:[studentDash,()=>t('dashboard')],pdash:[parentDash,()=>t('dashboard')],
};
const DEFAULT_VIEW={admin:'dash',finance:'finance',teacher:'tgroups',student:'sdash',parent:'pdash'};
let STATE={screen:'public',view:null,q:''};
function setView(v){STATE.view=v;STATE.q='';render();const c=document.querySelector('.content');if(c)c.scrollTo(0,0);}
function render(){
 const root=document.getElementById('root');const per=document.getElementById('persona');per.style.display='none';document.body.style.paddingTop='0';
 if(SES){ // logged in
   if(!STATE.view||!ROLE_NAV[SES.role].some(n=>n[0]===STATE.view))STATE.view=DEFAULT_VIEW[SES.role];
   STATE.q=(document.getElementById('q-st')||{}).value||STATE.q;
   const vf=VIEWS[STATE.view];root.innerHTML=shell(vf[0](),vf[1]());return;
 }
 if(STATE.screen==='login'){root.innerHTML=loginView();return;}
 root.innerHTML=publicSite();
}
load();render();
</script>
